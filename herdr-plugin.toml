id = "alx-xo.pr-status"
name = "PR Status"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Early-stage public plugin for customizable polling PR status"
platforms = ["macos", "linux"]

[[startup]]
command = ["bun", "src/main.ts", "start"]

[[actions]]
id = "info"
title = "PR Status plugin info"
description = "Verify the Bun plugin entrypoint"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "src/main.ts", "info"]

[[actions]]
id = "preview"
title = "Preview PR status"
description = "Read GitHub status for all workspace checkouts without publishing"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "src/main.ts", "preview"]

[[actions]]
id = "refresh"
title = "Refresh PR status"
description = "Manually update PR tokens for all workspace checkouts"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "src/main.ts", "refresh"]

[[actions]]
id = "start"
title = "Start PR polling"
description = "Ensure one detached poller for this Herdr session"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "src/main.ts", "start"]

[[actions]]
id = "stop"
title = "Stop PR polling"
description = "Stop this session poller without changing existing tokens"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "src/main.ts", "stop"]

[[actions]]
id = "status"
title = "PR polling status"
description = "Show current cycle and last success or error"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "src/main.ts", "status"]
